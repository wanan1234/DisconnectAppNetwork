name: Build DisconnectAppNetwork

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 使用 Theos Action 构建 Tweak
        uses: Randomblock1/theos-action@v1   # 使用专门的 Action
        with:
          build-command: make package FINALPACKAGE=1

      - name: 上传 .deb 产物
        uses: actions/upload-artifact@v4
        with:
          name: DisconnectAppNetwork-deb
          path: packages/*.deb
